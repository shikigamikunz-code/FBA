name: Build FBA APK on: workflow_dispatch: push: branches: 
      - main
permissions: contents: read jobs: build: runs-on: 
    ubuntu-latest steps:
      - name: Checkout project uses: actions/checkout@v4 - 
      name: Set up Java
        uses: actions/setup-java@v4 with: distribution: 
          temurin java-version: '17'
      - name: Set up Gradle uses: 
        gradle/actions/setup-gradle@v4
      - name: Set up Android SDK uses: 
        android-actions/setup-android@v3
      - name: Build APK run: gradle --no-daemon 
        assembleDebug
      - name: Upload APK uses: actions/upload-artifact@v4 
        with:
          name: FBA-debug-APK path: 
          app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
